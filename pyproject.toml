[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-istat-italian-places"
version = "0.3.5"
description = "A Django app to add ISTAT data resources Regions, Provinces and Cities from updated Official CSV file."
readme = "README.rst"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Francesco Cataldo", email = "francy111200@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2",
    "djangorestframework>=3.14",
    "django-filter>=23.0",
    "requests>=2.25",
]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.urls]
Homepage = "https://github.com/FraCata00/django-istat-italian-places"
Issues = "https://github.com/FraCata00/django-istat-italian-places/issues"

[tool.setuptools.packages.find]
include = ["comuni_italiani*"]
